# Dependabot must not touch test/integration/scenarios/.
#
# Those directories are hand-built fixtures whose manifests are deliberately
# bad: 07-unpinned-ranges pins nothing (`^4.17.21`, `~5.3.0`, `latest`),
# 11-known-malware pins chalk 5.6.1 because that release was compromised, and
# 10-self-integrity-tampered carries a corrupted integrity hash on purpose.
# Guard is asserted to flag exactly those inputs, so "upgrading" them deletes
# the thing under test. PR #25 proposed precisely that and was closed.
#
# Scoping version updates to the real manifests keeps Dependabot useful without
# letting it edit the fixtures.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint peers on `typescript >=4.8.4 <6.1.0`, and no released
      # version supports TypeScript 7. Dependabot grouped a 6.0.3 -> 7.0.2 bump
      # with the rest of the dev dependencies in #27; the result was a lockfile
      # npm could not resolve at all, so every CI job failed on `npm ci`.
      # Lift this once typescript-eslint widens its peer range.
      - dependency-name: typescript
        versions: ['>=7.0.0']
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(actions)
