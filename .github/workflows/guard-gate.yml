name: JADGuard supply-chain gate

# Guard's own self-gate: Guard audits Guard's dependency tree on every PR and
# every push to main, using the build from this working tree.
#
# Consumers should NOT copy this file — it invokes the local build directly.
# Copy `templates/github-actions.yml` instead; it resolves Guard from npm.
#
# Two modes:
#   scan  (pull_request) — checks only the dependencies changed by this PR.
#                          Fast feedback; closes the Miasma timing gap by
#                          catching planted hooks or Phantom Gyp before the
#                          branch is merged and pulled locally.
#   audit (push to main) — full-tree check on every merge. Catches anything
#                          not introduced through a PR, and also runs the
#                          agent-config-hooks rule against the repo itself so
#                          a hook planted by a compromised direct push is
#                          flagged immediately.
#
# To enable opt-in rules (binding-gyp, native-binary, typosquat, …) add --all
# to the `node dist/cli.js` invocations below.

on:
  pull_request:
  push:
    branches: [main]

# Workflow-level read-only baseline; jobs that upload SARIF elevate to write.
permissions:
  contents: read

concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PR gate ────────────────────────────────────────────────────────────────
  scan:
    if: github.event_name == 'pull_request'
    name: Scan changed dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # scan mode diffs against the merge-base; a full clone is the safest
          # way to ensure the base ref is reachable.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npx` cannot resolve Guard inside Guard's own repo: the package name
      # matches the project root, so npm never links node_modules/.bin/jadguard
      # and npx falls through to a binary that does not exist. Build first and
      # invoke the entry point directly.
      - name: Build
        run: npm run build

      - name: Scan changed dependencies
        run: node dist/cli.js scan

      - name: Generate SARIF
        if: always()
        run: node dist/cli.js scan --format sarif --output guard.sarif || true

      - name: Upload findings to code scanning
        # Fork PRs lack code-scanning write permission; skip the upload there.
        if: ${{ always() && !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@b22c66273205240d86582638b860f9b25772b4d3 # v3
        with:
          sarif_file: guard.sarif

  # ── Main-branch gate ───────────────────────────────────────────────────────
  audit:
    if: github.event_name == 'push'
    name: Audit full dependency tree
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npx` cannot resolve Guard inside Guard's own repo: the package name
      # matches the project root, so npm never links node_modules/.bin/jadguard
      # and npx falls through to a binary that does not exist. Build first and
      # invoke the entry point directly.
      - name: Build
        run: npm run build

      - name: Audit all dependencies
        run: node dist/cli.js audit

      - name: Generate SARIF
        if: always()
        run: node dist/cli.js audit --format sarif --output guard.sarif || true

      - name: Upload findings to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@b22c66273205240d86582638b860f9b25772b4d3 # v3
        with:
          sarif_file: guard.sarif
