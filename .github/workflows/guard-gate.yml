name: JADGuard supply-chain gate

# This is the reference workflow for projects that want to use JADGuard as a
# CI dependency gate. Copy it into your own repo's .github/workflows/.
#
# Two modes:
#   scan  (pull_request) — checks only the dependencies changed by this PR.
#                          Fast feedback; closes the Miasma timing gap by
#                          catching planted hooks or Phantom Gyp before the
#                          branch is merged and pulled locally.
#   audit (push to main) — full-tree check on every merge. Catches anything
#                          not introduced through a PR, and also runs the
#                          agent-config-hooks rule against the repo itself so
#                          a hook planted by a compromised direct push is
#                          flagged immediately.
#
# To enable opt-in rules (binding-gyp, native-binary, typosquat, …) add --all
# to the `npx @jadapp/guard` invocations below.

on:
  pull_request:
  push:
    branches: [main]

# Workflow-level read-only baseline; jobs that upload SARIF elevate to write.
permissions:
  contents: read

concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PR gate ────────────────────────────────────────────────────────────────
  scan:
    if: github.event_name == 'pull_request'
    name: Scan changed dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # scan mode diffs against the merge-base; a full clone is the safest
          # way to ensure the base ref is reachable.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan changed dependencies
        run: npx @jadapp/guard scan

      - name: Generate SARIF
        if: always()
        run: npx @jadapp/guard scan --format sarif --output guard.sarif || true

      - name: Upload findings to code scanning
        # Fork PRs lack code-scanning write permission; skip the upload there.
        if: ${{ always() && !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@b22c66273205240d86582638b860f9b25772b4d3 # v3
        with:
          sarif_file: guard.sarif

  # ── Main-branch gate ───────────────────────────────────────────────────────
  audit:
    if: github.event_name == 'push'
    name: Audit full dependency tree
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npx @jadapp/guard audit

      - name: Generate SARIF
        if: always()
        run: npx @jadapp/guard audit --format sarif --output guard.sarif || true

      - name: Upload findings to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@b22c66273205240d86582638b860f9b25772b4d3 # v3
        with:
          sarif_file: guard.sarif
