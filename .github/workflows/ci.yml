name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` honours the committed .npmrc, which sets ignore-scripts=true.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # The unit suite mocks lockfile input; this drives the built CLI over the
      # fixture projects instead, so the npm/yarn/pnpm/bun parsers are actually
      # executed. Without it a lockfile-parser dependency can be bumped and
      # merged on a fully green build.
      - name: Integration scenarios
        run: npm run integration

  dogfood:
    name: dogfood (Guard audits its own dependencies)
    runs-on: ubuntu-latest
    # Read the repo, and write code-scanning results for the SARIF upload.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Gate Guard's own resolved tree with the build under test (not the
      # published version). Offline keeps it deterministic and free of OSV /
      # registry flakiness, while still running known-malware, self-integrity,
      # integrity, install-scripts and the rest of the offline checks.
      - name: Audit Guard's own dependencies
        run: node dist/cli.js audit --offline

      # Surface findings in the Security tab — Guard dogfooding its own SARIF
      # reporter. Always runs so findings show even when the gate fails; the
      # `|| true` keeps SARIF generation from masking the gate's exit code.
      - name: Generate SARIF
        if: always()
        run: node dist/cli.js audit --offline --format sarif --output jadguard.sarif || true

      - name: Upload findings to code scanning
        # Fork PRs lack code-scanning write, so skip the upload there.
        if: ${{ always() && !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@b22c66273205240d86582638b860f9b25772b4d3 # v3
        with:
          sarif_file: jadguard.sarif
